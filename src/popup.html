<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FB Page Scraper</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <style>
      :root {
        --primary: #0d9488;
        --primary-dark: #0f766e;
        --primary-soft: #ccfbf1;
        --bg: #f8fafc;
        --surface: #ffffff;
        --border: #e2e8f0;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #ea580c;
        --danger: #dc2626;
        --radius: 12px;
        --gap: 8px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 340px;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        line-height: 1.5;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      .logo {
        width: 34px; height: 34px;
        border-radius: 10px;
        background: var(--primary);
        display: grid; place-items: center;
        color: #fff; font-weight: 700; font-size: 16px;
        flex-shrink: 0;
      }
      h1 { font-size: 15px; font-weight: 700; }
      .subtitle { font-size: 12px; color: var(--muted); }
      main { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
      .status-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .status-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .pill {
        font-size: 12px; font-weight: 600;
        padding: 3px 10px;
        border-radius: 999px;
        background: var(--primary-soft);
        color: var(--primary-dark);
        text-transform: capitalize;
      }
      .pill.idle { background: #e2e8f0; color: #475569; }
      .pill.cooldown, .pill.stopped { background: #fee2e2; color: #b91c1c; }
      .pill.done { background: #dcfce7; color: #166534; }
      .metric { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; }
      .metric b { color: var(--text); font-weight: 600; }
      .last-action {
        font-size: 12px; color: var(--muted);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .actions { display: flex; gap: var(--gap); }
      button {
        flex: 1;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 14px;
        border: 1px solid transparent;
        border-radius: 10px;
        cursor: pointer;
        transition: background 150ms ease, transform 80ms ease, box-shadow 150ms ease;
      }
      button:active { transform: scale(0.98); }
      button:focus-visible { outline: 3px solid rgba(13, 148, 136, 0.35); outline-offset: 2px; }
      .primary { background: var(--primary); color: #fff; }
      .primary:hover { background: var(--primary-dark); box-shadow: 0 2px 8px rgba(13, 148, 136, 0.3); }
      .ghost { background: var(--surface); color: var(--text); border-color: var(--border); }
      .ghost:hover { background: #f1f5f9; }
      .danger { background: var(--surface); color: var(--danger); border-color: #fecaca; }
      .danger:hover { background: #fef2f2; }
      .secondary-row { display: flex; gap: var(--gap); }
      .link-btn {
        flex: 1;
        text-align: center;
        font-size: 13px;
        font-weight: 500;
        color: var(--primary-dark);
        background: var(--surface);
        border: 1px solid var(--border);
        padding: 8px 10px;
        border-radius: 10px;
        cursor: pointer;
        text-decoration: none;
        transition: background 150ms ease;
      }
      .link-btn:hover { background: #f0fdfa; }
      .toast-wrap { position: relative; }
      [data-toast] {
        position: absolute;
        left: 16px; right: 16px; bottom: 14px;
        background: var(--text);
        color: #fff;
        font-size: 12.5px;
        padding: 10px 14px;
        border-radius: 10px;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 180ms ease, transform 180ms ease;
        pointer-events: none;
        z-index: 10;
      }
      [data-toast].show { opacity: 1; transform: translateY(0); }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">F</div>
      <div>
        <h1>FB Page Scraper</h1>
        <div class="subtitle">Business lead collector</div>
      </div>
    </header>
    <main>
      <section class="status-card" aria-label="Scraper status">
        <div class="status-row">
          <span class="pill" data-status>idle</span>
          <span class="metric" style="gap:4px;">today <b data-today>0</b></span>
          <span class="metric" style="gap:4px;">run <b data-run>0</b></span>
        </div>
        <div class="metric"><span>Queue</span><b data-queue>0</b></div>
        <div class="last-action" data-last>No run yet</div>
      </section>
      <section class="actions" aria-label="Controls">
        <button class="primary" data-start>Start</button>
        <button class="danger" data-stop>Stop</button>
      </section>
      <section class="actions" aria-label="Export">
        <button class="ghost" data-export>Export CSV</button>
      </section>
      <section class="secondary-row">
        <a class="link-btn" href="#" id="open-settings">Settings</a>
      </section>
    </main>
    <div data-toast role="status" aria-live="polite"></div>
    <script src="popup.js"></script>
  </body>
</html>
